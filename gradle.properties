# --- FIX: Gradle daemon Out-Of-Memory crash (hs_err_pid8836.log) -------------
# Mesin build ini hanya punya total RAM 3GB (lihat "Host: ... 3G" di hs_err log).
# Konfigurasi lama minta heap -Xmx2048m HANYA untuk daemon Gradle, padahal proses
# Kotlin compiler daemon, AAPT2 daemon, dan Android Studio sendiri juga rebutan
# RAM yang sama. Total kebutuhan native memory (heap + metaspace + code cache +
# thread stacks tiap daemon) jadi > RAM fisik + swap yang tersedia -> JVM gagal
# mmap virtual space untuk G1 GC dan crash (Native memory allocation failed).
#
# Perbaikan: turunkan heap tiap JVM yang dipakai build, batasi jumlah worker
# paralel, dan batasi metaspace supaya total pemakaian RAM realistis untuk 3GB.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Batasi JVM daemon Kotlin compiler terpisah (proses sendiri, di luar heap Gradle di atas)
kotlin.daemon.jvm.options=-Xmx768m,-XX:MaxMetaspaceSize=256m

# Jangan compile modul secara paralel / banyak worker sekaligus -> mengurangi
# jumlah proses JVM yang hidup bersamaan saat build.
org.gradle.parallel=false
org.gradle.workers.max=2

# Build cache tetap dinyalakan (murah dari sisi RAM, mempercepat build berikutnya)
org.gradle.caching=true

# Matikan daemon Gradle yang idle lebih cepat (default 3 jam) supaya RAM tidak
# terus tertahan oleh proses lama kalau sedang tidak build.
org.gradle.daemon.idletimeout=60000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
